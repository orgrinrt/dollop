[workspace]
members = ["impligen"]

[workspace.package]
version = "0.0.1"
edition = "2018"
rust-version = "1.64.0"
authors = ["orgrinrt", "Hiisi Digital"]

[workspace.dependencies]

[package]
name = "dollop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "An experimental allocator implementing several strategies with common api patterns for more convenient reuse"
license = "MPL-2.0"
readme = "README.md"
keywords = []
categories = []
documentation = "https://docs.rs/dollop"
homepage = "https://github.com/orgrinrt/dollop"
repository = "https://github.com/orgrinrt/dollop"

[dependencies]

[features]
default = ["tlsf", "no_std"]
# One feature per allocator. Each gates its module, so turning it off removes the code rather
# than leaving a switch that forwards nothing.
tlsf = []
# Sets `#![no_std]`. There is no paired `std` feature because nothing here needs one: with this
# off the crate simply compiles against std.
no_std = []

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"

[lib]
doctest = true

[package.metadata.clippy]
default-features = true
extra-plugins = [
    "clippy::pedantic",
    "clippy::cargo",
    "+clippy::nursery",
    "+clippy::style",
    "+clippy::complexity",
    "+clippy::perf",
    "+clippy::correctness",
    "+clippy::suspicious",
    "+clippy::deprecated"
]
